<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAMI LIVE - البث</title>

    <link rel="stylesheet" href="/shared/frame.css">
    <link rel="stylesheet" href="/shared/background.css">
    <link rel="stylesheet" href="/shared/header.css">
    <link rel="stylesheet" href="/shared/navigation.css">
</head>

<body>

    <main class="app">

        <div class="background"></div>

        <div class="content">

            <header class="app-header">
                <div class="app-logo">SAMI LIVE</div>
                <div class="app-subtitle">LIVE CONTROL</div>
            </header>

            <nav class="navigation">

                <button
                    class="nav-button"
                    data-page="dashboard"
                    onclick="navigateTo('/dashboard/')">
                    الرئيسية
                </button>

                <button
                    class="nav-button active"
                    data-page="stream"
                    onclick="navigateTo('/stream/')">
                    البث
                </button>

                <button
                    class="nav-button"
                    data-page="games"
                    onclick="navigateTo('/games/')">
                    الألعاب
                </button>

                <button
                    class="nav-button"
                    data-page="settings"
                    onclick="navigateTo('/settings/')">
                    الإعدادات
                </button>

            </nav>

            <section class="stream-content">

                <div class="stream-card">

                    <div class="stream-icon">●</div>

                    <div class="stream-title">
                        معلومات البث
                    </div>

                    <div class="stream-row">
                        <span>الحساب</span>
                        <strong id="streamUsername">---</strong>
                    </div>

                    <div class="stream-row">
                        <span>الحالة</span>
                        <strong id="streamStatus">---</strong>
                    </div>

                    <div class="stream-row">
                        <span>المشاهدون</span>
                        <strong id="streamViewers">0</strong>
                    </div>

                    <div class="stream-row">
                        <span>الإعجابات</span>
                        <strong id="streamLikes">0</strong>
                    </div>

                </div>

            </section>

        </div>

    </main>

    <script src="/shared/common.js"></script>
    <script src="/stream/stream.js"></script>

</body>

</html>
