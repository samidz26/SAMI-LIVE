<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAMI LIVE - الألعاب</title>

    <link rel="stylesheet" href="/shared/frame.css">
    <link rel="stylesheet" href="/shared/background.css">
    <link rel="stylesheet" href="/shared/header.css">
    <link rel="stylesheet" href="/shared/navigation.css">
</head>

<body>

    <main class="app">

        <div class="background"></div>

        <div class="content">

            <header class="app-header">
                <div class="app-logo">SAMI LIVE</div>
                <div class="app-subtitle">LIVE CONTROL</div>
            </header>

            <nav class="navigation">

                <button
                    class="nav-button"
                    data-page="dashboard"
                    onclick="navigateTo('/dashboard/')">
                    الرئيسية
                </button>

                <button
                    class="nav-button"
                    data-page="stream"
                    onclick="navigateTo('/stream/')">
                    البث
                </button>

                <button
                    class="nav-button active"
                    data-page="games"
                    onclick="navigateTo('/games/')">
                    الألعاب
                </button>

                <button
                    class="nav-button"
                    data-page="settings"
                    onclick="navigateTo('/settings/')">
                    الإعدادات
                </button>

            </nav>

            <section class="games-content">

                <div class="games-placeholder">

                    <div class="games-icon">
                        🎮
                    </div>

                    <div class="games-title">
                        الألعاب
                    </div>

                    <div class="games-text">
                        سيتم إضافة الألعاب هنا لاحقًا
                    </div>

                </div>

            </section>

        </div>

    </main>

    <script src="/shared/common.js"></script>

</body>

</html>
