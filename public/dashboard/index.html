<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAMI LIVE</title>

    <link rel="stylesheet" href="/shared/frame.css">
    <link rel="stylesheet" href="/shared/background.css">
    <link rel="stylesheet" href="/shared/header.css">
    <link rel="stylesheet" href="/shared/navigation.css">
    <link rel="stylesheet" href="/dashboard/style.css">
</head>

<body>

    <main class="app">

        <div class="background"></div>

        <div class="content">

            <header class="app-header">
                <div class="app-logo">SAMI LIVE</div>
                <div class="app-subtitle">LIVE CONTROL</div>
            </header>

            <nav class="navigation">

                <button class="nav-button active"
                    data-page="dashboard"
                    onclick="navigateTo('/dashboard/')">
                    الرئيسية
                </button>

                <button class="nav-button"
                    data-page="stream"
                    onclick="navigateTo('/stream/')">
                    البث
                </button>

                <button class="nav-button"
                    data-page="games"
                    onclick="navigateTo('/games/')">
                    الألعاب
                </button>

                <button class="nav-button"
                    data-page="settings"
                    onclick="navigateTo('/settings/')">
                    الإعدادات
                </button>

            </nav>

            <section class="dashboard-content">

                <!-- أفضل المكبسين -->

                <div class="tappers-section">

                    <div class="section-title">
                        🔥 أفضل المكبسين
                    </div>

                    <div id="tappersList" class="tappers-list">

                        <div class="no-data">
                            بانتظار التكبيس...
                        </div>

                    </div>

                </div>

                <!-- الداخلون -->

                <div class="members-section">

                    <div class="section-title">
                        👥 الداخلون إلى اللايف
                    </div>

                    <div id="membersList" class="members-list">

                        <div class="no-data">
                            بانتظار دخول المتابعين...
                        </div>

                    </div>

                </div>

            </section>

        </div>

    </main>

    <script src="/shared/common.js"></script>
    <script src="/dashboard/app.js"></script>

</body>

</html>
