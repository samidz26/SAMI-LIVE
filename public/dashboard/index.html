<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAMI LIVE</title>

    <link rel="stylesheet" href="/shared/frame.css">
    <link rel="stylesheet" href="/shared/background.css">
    <link rel="stylesheet" href="/shared/header.css">
    <link rel="stylesheet" href="/shared/navigation.css">
    <link rel="stylesheet" href="/dashboard/style.css">
</head>

<body>

<main class="app">

    <div class="background"></div>

    <div class="content">

        <!-- HEADER -->
        <header class="app-header">
            <div class="app-logo">SAMI LIVE</div>
            <div class="app-subtitle">LIVE CONTROL</div>
        </header>


        <!-- MAIN AREA -->
        <section class="dashboard-layout">

            <!-- ================================= -->
            <!-- LEFT COLUMN -->
            <!-- ================================= -->

            <aside class="side-column">

                <!-- ===== TOP TAPPERS ===== -->

                <section class="panel tappers-panel">

                    <div class="panel-title">
                        <span>♡</span>
                        ترتيب التكبيس
                    </div>

                    <div id="tappersList" class="tappers-list">

                        <div class="empty-state">
                            بانتظار التكبيس...
                        </div>

                    </div>

                </section>


                <!-- ===== LATEST MEMBER ===== -->

                <section class="panel join-panel">

                    <div class="panel-title">
                        <span>♙</span>
                        آخر الداخلين
                    </div>

                    <div id="latestMember" class="latest-member">

                        <div class="empty-member">
                            <div class="empty-icon">♙</div>
                            <div>بانتظار دخول المتابعين...</div>
                        </div>

                    </div>

                </section>

            </aside>


            <!-- ================================= -->
            <!-- MAIN DISPLAY -->
            <!-- ================================= -->

            <section class="main-display">

                <div class="display-glow"></div>

                <div class="display-content">

                    <div class="display-icon">
                        ◇
                    </div>

                    <div class="display-title">
                        واجهة العرض الرئيسية
                    </div>

                    <div class="display-subtitle">
                        ستظهر الأحداث الرئيسية هنا
                    </div>

                </div>

            </section>

        </section>


        <!-- ================================= -->
        <!-- NAVIGATION -->
        <!-- ================================= -->

        <nav class="navigation">

            <button
                class="nav-button active"
                data-page="dashboard"
                onclick="navigateTo('/dashboard/')">
                الرئيسية
            </button>

            <button
                class="nav-button"
                data-page="stream"
                onclick="navigateTo('/stream/')">
                البث
            </button>

            <button
                class="nav-button"
                data-page="games"
                onclick="navigateTo('/games/')">
                الألعاب
            </button>

            <button
                class="nav-button"
                data-page="settings"
                onclick="navigateTo('/settings/')">
                الإعدادات
            </button>

        </nav>

    </div>

</main>

<script src="/shared/common.js"></script>
<script src="/dashboard/app.js"></script>

</body>
</html>
